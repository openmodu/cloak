# cloak 服务配置示例。
# 取值优先级：命令行 > 环境变量 > 本文件 > 默认值。
# 环境变量前缀是 CLOAK_，例如 CLOAK_PORT、CLOAK_API_KEY_FILE。

port: 8844

# LLM API key 文件路径。不配则不接入大模型，/api/call 返回 503，
# 脱敏与还原接口照常工作。文件格式：
# {
#   "openai-api-key": "your-key",
#   "openai-base-url": "https://api.openai.com/v1",
#   "openai-model": "gpt-4o-mini"
# }
# api_key_file: ~/.cloak/your-key.json

# 本服务自身的访问口令。留空则不校验 Authorization 头。
# http_api_key: change-me

# 本地 NER。需要带 ONNX 支持编译的二进制（-tags cloak_onnx），
# 模型与动态库用 scripts/setup-ner.sh 一键准备。
# 不配则只用正则识别，人名、机构名、中文地址不会被脱敏。
models_dir: ~/.cloak/models
#
# 两个模型在 models_dir 下的相对路径，留空用默认值。
# 标签集须是 PER / ORG / LOC 这一套。
en_model_id: Xenova/bert-base-NER
zh_model_id: Xenova/bert-base-multilingual-cased-ner-hrl
# 地址隐私兜底配置
address_fallback: true

log_level: "INFO"
temperature: 0.0

# 各类敏感实体的脱敏开关。默认除物理地址外全开。
mask_config:
  maskAddress: true
  maskEmail: true
  maskOrganization: true
  maskUserName: true
  maskPhoneNumber: true
  maskBankNumber: true
  maskPayment: true
  maskVerificationCode: true
  maskPassword: true
  maskRandomSeed: true
  maskPrivateKey: true
  maskUrl: true
